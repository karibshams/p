<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ksGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFC2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <polygon points="50,4 93,28 93,72 50,96 7,72 7,28"
    stroke="url(#ksGrad)" stroke-width="2" fill="rgba(0,255,194,0.06)"/>

  <!-- Inner hexagon -->
  <polygon points="50,14 83,32 83,68 50,86 17,68 17,32"
    stroke="rgba(0,255,194,0.25)" stroke-width="1" fill="none"/>

  <!-- Circuit dots at corners -->
  <circle cx="50" cy="4"  r="2.5" fill="#00FFC2" filter="url(#glow)"/>
  <circle cx="93" cy="28" r="2.5" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="93" cy="72" r="2.5" fill="#00FFC2" filter="url(#glow)"/>
  <circle cx="50" cy="96" r="2.5" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="7"  cy="72" r="2.5" fill="#00FFC2" filter="url(#glow)"/>
  <circle cx="7"  cy="28" r="2.5" fill="#22D3EE" filter="url(#glow)"/>

  <!-- K letter -->
  <line x1="24" y1="32" x2="24" y2="68" stroke="url(#ksGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="24" y1="50" x2="44" y2="32" stroke="url(#ksGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="24" y1="50" x2="44" y2="68" stroke="url(#ksGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- S letter -->
  <path d="M74 36 Q74 32 68 32 L60 32 Q54 32 54 40 Q54 48 68 50 Q76 52 76 60 Q76 68 68 68 L58 68 Q52 68 52 64"
    stroke="url(#ksGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="2" fill="rgba(0,255,194,0.4)"/>
</svg>
